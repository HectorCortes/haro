schema: spec-driven

# Shardeo — SDD project config (hybrid mode)
# Generated by sdd-init re-run 2026-08-27. Do not hand-edit testing: — it is cached from detection.

context: |
  Tech stack: TypeScript ESM, Node >= 20 (v24.19.0), CAC, better-sqlite3, zod, yaml, node-pty
  Architecture: CLI + SQLite persistence behind repository interface; Zod-validated YAML workflows (DAG via depends_on); adapters isolated per harness (OpenCode v1); headless/supervised/terminal surfaces (Spec 9)
  Testing: node --test via npm test (~550 cases, ~74 suites), tsc --noEmit; no linter/formatter/coverage
  Style: Strict TDD enabled (default — runner exists, no opt-out marker); ESM strict TS; artifact reports under .shardeo/artifacts/
  Persistence: hybrid (Engram + OpenSpec) — execution mode auto, delivery single-pr, review budget 100000

# Execution preflight (user-fixed 2026-08-27)
execution:
  mode: auto
  artifact_store: both
  delivery_strategy: single-pr
  review_budget_lines: 100000

strict_tdd: true

testing:
  runner:
    command: "npm test"
    framework: "node:test (Node.js built-in)"
  layers:
    unit: true
    integration: true
    e2e: true
  coverage:
    available: false
    command: ""
  quality:
    linter: { available: false, command: "" }
    type_checker: { available: true, command: "npm run typecheck (tsc --noEmit)" }
    formatter: { available: false, command: "" }
  notes: "pretest runs npm run build (tsc). node_modules currently absent — run npm install to enable tsc/typecheck. No c8/vitest/jest coverage, no ESLint/Biome/Prettier."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference SPECS.md + docs/v2/ constitucion as normative sources
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (src/ ESM, zod validation, better-sqlite3 repo)
      - Respect fail-closed and permission policy (never bypass)
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    typecheck_command: "npm run typecheck"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
