schema: spec-driven

# Haro — SDD project config (hybrid mode)
# Generated by sdd-init re-run 2026-08-27, rewritten by v2-spike-go 2026-08-28 for Go.

context: |
  Tech stack: Go 1.23+ pure Go/no cgo, standard testing, gopkg.in/yaml.v3, modernc.org/sqlite, Unix sockets
  Architecture: minimal spike proofs in internal/{workflow,store,ipc,adapter} + testdata/sample-workflow.yaml; repository/DAG/adapter/broker deferred to later v2 changes; PTY deferred
  Testing: go test ./... with -race, go vet ./..., golangci-lint run, govulncheck ./...; table-driven, t.TempDir, short h.sock
  Style: Strict TDD enabled (runner exists); pure Go, no cgo; hybrid artifact reports
  Persistence: hybrid (Engram + OpenSpec) — execution mode auto, delivery single-pr, review budget 20000

# Execution preflight (user-fixed 2026-08-27, updated by v2-spike-go)
execution:
  mode: auto
  artifact_store: both
  delivery_strategy: single-pr
  review_budget_lines: 20000

strict_tdd: true

testing:
  runner:
    command: "go test ./..."
    framework: "testing"
  layers:
    unit: true
    integration: true
    e2e: true
  coverage:
    available: false
    command: ""
  quality:
    linter: { available: true, command: "golangci-lint run" }
    type_checker: { available: true, command: "go vet ./..." }
    formatter: { available: false, command: "" }
  notes: "Go testing via standard testing package; no coverage threshold. Linter golangci-lint run and type checker go vet ./... available; govulncheck via CI."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference SPECS.md + docs/v2/ constitucion as normative sources
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing Go patterns (pure Go, no cgo, standard errors, t.TempDir, short socket paths)
      - Respect fail-closed and permission policy (never bypass)
    tdd: true
    test_command: "go test ./..."
  verify:
    test_command: "go test ./... -race"
    build_command: "go build ./..."
    typecheck_command: "go vet ./..."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
